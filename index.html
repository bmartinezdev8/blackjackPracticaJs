<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

  </head>

  <body>
    <header class="titulo">
    <h1>♠ BLACKJACK ♥</h1>
    <p>21 · JUEGO DE CARTAS</p>
    </header>
    <div class="row mt-2">
    <div id="divBotones" class="col text-center">
      <button id="btnNuevo" class="btn btn-danger">Nuevo Juego</button>
      <button id="btnPedir" class="btn btn-primary">Pedir carta</button>
      <button id="btnDetener" class="btn btn-primary">Detener</button>
    </div>
  </div>

  
  <main class="container-fluid mt-4">
    <div class="row g-4">
    <!-- Sección del jugador -->
    <section class="col-12 col-md-6">
      <div class="panel-juego">
          <h2>Jugador 1 - <small id="puntos-jugador">0</small></h2>
          <img class="fichas-decorativas fichas-izquierda" src="./assets/img/fichas-jugador.png" alt=""/>
          <div id="jugador-cartas">
          </div>
      </div>
    </section>

    <!-- Sección de la computadora -->
    <section class="col-12 col-md-6">
      <div class="panel-juego">
        <h2>Computadora - <small id="puntos-computadora">0</small></h2>
        <img class="fichas-decorativas fichas-derecha" src="./assets/img/fichas-computadora.png" alt="">
        <div id="computadora-cartas">
          <!-- Cartas de la computadora -->
        </div>
      </div>
    </section>

  </div>
  
  <!-- Estadísticas del Blackjack -->
  <section id="seccion-estadisticas" class="mt-4">

    <h2>Estadísticas de partidas</h2>

    <div class="resumen-estadisticas">
      <p>Partidas jugadas: <span id="total-partidas">0</span></p>
      <p>Victorias: <span id="total-victorias">0</span></p>
      <p>Derrotas: <span id="total-derrotas">0</span></p>
      <p>Empates: <span id="total-empates">0</span></p>
      <p>Porcentaje de victorias: <span id="porcentaje-victorias">0%</span></p>
    </div>

    <details id="historial-desplegable">
      <summary>Ver historial de partidas</summary>

      <div class="table-responsive mt-3">
        <table class="table table-dark table-striped">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Jugador</th>
              <th>Computadora</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody id="tabla-historial">
            <!-- Las partidas se agregarán con JavaScript -->
          </tbody>
        </table>
      </div>
    </details>

  <div class="text-end mt-3">
    <button id="btnLimpiarHistorial" class="btn btn-outline-danger" type="button">
      Borrar historial
    </button>
  </div>

  </section>

</main>


    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
